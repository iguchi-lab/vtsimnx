name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint / typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[dev]"

      - name: Ruff
        run: python -m ruff check vtsimnx engine/app examples

      - name: MyPy
        run: python -m mypy vtsimnx engine/app

  python-client:
    name: Python client tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 宣言最小 / 主要 / 最新安定（2026-07 時点で 3.13）
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[dev,astro]"

      - name: Pytest (vtsimnx/tests)
        run: python -m pytest vtsimnx/tests

  engine-python:
    name: Engine / builder tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install engine Python deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[dev,engine]"

      - name: Install solver build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            libboost-dev libeigen3-dev libceres-dev libsuitesparse-dev

      - name: Build C++ solver
        working-directory: engine
        run: |
          cmake -S solver -B build-solver \
            -DCMAKE_BUILD_TYPE=Release \
            -DVTSIMNX_BUILD_CPP_TESTS=OFF
          cmake --build build-solver -j"$(nproc)"
          test -x build/vtsimnx_solver

      - name: Pytest (engine/tests_py)
        working-directory: engine
        run: python -m pytest tests_py -m "not physics and not perf"

  physics-regression:
    name: Physics baseline regression (py3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install engine Python deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[dev,engine]"

      - name: Install solver build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            libboost-dev libeigen3-dev libceres-dev libsuitesparse-dev

      - name: Build C++ solver
        working-directory: engine
        run: |
          cmake -S solver -B build-solver \
            -DCMAKE_BUILD_TYPE=Release \
            -DVTSIMNX_BUILD_CPP_TESTS=OFF
          cmake --build build-solver -j"$(nproc)"
          test -x build/vtsimnx_solver

      - name: Pytest physics baselines
        working-directory: engine
        run: python -m pytest tests_py -m physics

  perf-history:
    name: Performance history (py3.11, warn-only)
    runs-on: ubuntu-latest
    # 厳密合否は不安定なため、ジョブ自体は計測成功で緑。大幅退行はログ WARNING。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install engine Python deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[dev,engine]"

      - name: Install solver build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            libboost-dev libeigen3-dev libceres-dev libsuitesparse-dev

      - name: Build C++ solver
        working-directory: engine
        run: |
          cmake -S solver -B build-solver \
            -DCMAKE_BUILD_TYPE=Release \
            -DVTSIMNX_BUILD_CPP_TESTS=OFF
          cmake --build build-solver -j"$(nproc)"
          test -x build/vtsimnx_solver

      - name: Run performance benches
        working-directory: engine
        env:
          VTSIMNX_TIMINGS: "1"
        run: |
          mkdir -p perf-artifacts
          python tests_py/perf/run_bench.py --output perf-artifacts/perf_report.json
          python -m pytest tests_py -m perf -v

      - name: Upload perf report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-history-report
          path: engine/perf-artifacts/perf_report.json
          if-no-files-found: warn

  cpp-solver:
    name: C++ solver build + CTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            libboost-dev libeigen3-dev libceres-dev libsuitesparse-dev

      - name: Configure
        working-directory: engine
        run: |
          cmake -S solver -B build-solver \
            -DCMAKE_BUILD_TYPE=Release \
            -DVTSIMNX_BUILD_CPP_TESTS=ON

      - name: Build
        working-directory: engine
        run: cmake --build build-solver -j"$(nproc)"

      - name: CTest
        working-directory: engine
        run: ctest --test-dir build-solver --output-on-failure --timeout 300

  package:
    name: Package wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel in clean venv and import
        run: |
          python -m venv /tmp/vtsimnx-wheel-venv
          /tmp/vtsimnx-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/vtsimnx-wheel-venv/bin/python -m pip install dist/vtsimnx-*.whl
          /tmp/vtsimnx-wheel-venv/bin/python -c "import vtsimnx as vt; print(vt.__name__); assert callable(vt.run_calc)"

  example:
    name: Example smoke (run_calc_minimal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install solver build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            libboost-dev libeigen3-dev libceres-dev libsuitesparse-dev

      - name: Build C++ solver
        working-directory: engine
        run: |
          cmake -S solver -B build-solver \
            -DCMAKE_BUILD_TYPE=Release \
            -DVTSIMNX_BUILD_CPP_TESTS=OFF
          cmake --build build-solver -j"$(nproc)"
          test -x build/vtsimnx_solver

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[engine]"

      - name: Start API and run minimal example
        run: |
          set -euo pipefail
          (
            cd engine
            python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
          ) &
          API_PID=$!
          cleanup() { kill "$API_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ping >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ping

          export VTSIMNX_API_URL=http://127.0.0.1:8000
          python examples/run_calc_minimal.py --request-json /tmp/result_request_minimal.json
