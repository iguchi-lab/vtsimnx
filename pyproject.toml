[project]
name = "vtsimnx"
version = "1.5.2"
description = "Network-based ventilation and thermal simulation tool"
license = "MIT"
authors = [
  { name="Masato Iguchi", email="iguchi.masato@gmail.com" }
]
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "requests>=2.31,<3",
]

[project.urls]
Repository = "https://github.com/iguchi-lab/vtsimnx"
Documentation = "https://github.com/iguchi-lab/vtsimnx/blob/main/README.md"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "black>=24",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-requests>=2.31",
  "build>=1.0",
]
engine = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
]
astro = [
  "astropy>=5",
]

[tool.setuptools.packages.find]
include = ["vtsimnx*"]

[tool.pytest.ini_options]
testpaths = ["vtsimnx/tests"]
addopts = "-q"
markers = [
  "slow: long-running tests",
  "astro: requires astropy",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  "examples/vs_simheat_sample.py",
  "build",
  "dist",
  "engine/build",
  "engine/build-solver",
  "engine/work",
]

[tool.ruff.lint]
# CI 基盤ではまず構文・未使用 import 等を担保し、isort は段階導入する
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
pretty = true
exclude = [
  "(?x)(^examples/vs_simheat_sample\\.py$|^build/|^dist/|^engine/build|^engine/work/)",
]

[[tool.mypy.overrides]]
module = [
  "app.builder.*",
]
ignore_errors = true
# builder の TypedDict 整合は段階的に厳密化する。pytest で契約を担保する。
